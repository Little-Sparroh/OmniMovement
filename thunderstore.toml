[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "OmniMovement"
description = "Makes ground movement speed consistent in all directions (forward, strafe, backward, diagonals, and slide strafe)."
websiteUrl = "https://github.com/Little-Sparroh/OmniMovement"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/netstandard2.1/OmniMovement.dll"
target = "BepInEx/plugins/OmniMovement.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = ["mycopunk"]

[publish.categories]
mycopunk = ["client"]
